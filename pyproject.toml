[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-browser-themes"
version = "0.1.0"
description = "A native theming toolkit and live theme studio for Polar Browser"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "maxmoneycash"}]
keywords = ["polar-browser", "themes", "macos", "customization"]

[project.scripts]
polar-themes = "polar_themes.cli:main"

[tool.setuptools]
packages = ["polar_themes"]

[tool.setuptools.package-data]
polar_themes = ["assets/themes/*.json", "assets/schema/*.json", "assets/studio/*"]
